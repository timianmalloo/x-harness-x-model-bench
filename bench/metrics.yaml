# Metric catalogue v0. Source: proposal "Metric taxonomy".
# Each metric is recorded raw, then normalised 0-100 per task (higher is better).
# source: D deterministic script · J LLM judge · H harness telemetry · P pack-only
# better: which raw direction is good (normalisation flips "lower").
# grader: the src/harness_bench/grade/ module that owns the metric.
# A metric a grader cannot measure is "not recorded" and excluded from the composite, never 0.
# Oracle ladder: a metric is measured by the strongest mechanical oracle available (proof or model
# check > trace conformance > tests > judge). J metrics cover only what no rung above can measure.
# Changing a definition, weight or rubric bumps `version` (historical scores must not move silently).
schema: bench-metrics/1
version: "0.6"   # 0.6: scale 4 on bug_claim_precision, model_conformance, model_non_vacuity, moving catalog_hash (R-84; R-86 c1 ADR-0006:59 instance); extraction_id leaves views.export -- provenance, like grader_build, not a result (R-86); 0.5: frozen by the Leader 2026-09-27 (R-78 c5; bench/catalog-freeze.yaml with views and board goldens; a change after this is 0.6); 0.5.dev: R-79 normalisation anchors on every kind: score, weight > 0 metric; R-78 weight-0 corrections (pass_at_1 the gate factor; pass_hat_k, cost_of_pass, tokens_per_solved, wall_clock_split kind: derived, cell composites read kind: score only); 0.4: the wave-3 graders (frozen by the Leader 2026-09-25, R-59 c3; bench/catalog-freeze.yaml; a change after this is 0.5); 0.4.dev: kind, asked_unmatched, scope_creep_files; 0.3: decimal scales for non-integer values (ADR-0006: no floats in the ledger); 0.2: formal metrics and protocol conformance
# scale: a non-integer value is stored as a decimal string with this many places.
# kind: score (one row per cell per grading pass, for each task whose graders name its grader) |
#       derived (computed above the cell or in views; never a score row, DM7).
# anchor: [worst, best] in raw units, required on every kind: score, weight > 0 metric. Normalisation
#   saturates: t = (x - worst) / (best - worst); N = 100 * clamp(t, 0, 1) -- a value past the anchor
#   scores 0 or 100 and never shifts another cell (R-79 item 1).
# anchor_note: one clause naming the anchor's source, exactly one of three forms --
#   spec <path>:<line> | measured <run> <min>..<max> (n tasks, k runs) | convention: <reason> -- never unmarked.
#   A measured or provisional anchor is re-anchored in the next version when a run saturates a cell.
composite:
  area_score: weighted mean of normalised metrics in the area
  overall: correctness-gated   # a cheap failure never outranks an expensive pass
  rank_rule: no rank above a combo whose bootstrap interval on the gated composite overlaps
areas:
  cost:
    title: Cost & efficiency
    metrics:
      - { id: tokens_by_type,          source: [H],    better: lower,  grader: cost,        kind: derived, weight: 0, note: "raw only; in/out/cacheRead/cacheWrite by model" }
      - { id: cost_usd,                source: [H, D], better: lower,  grader: cost,        kind: score, weight: 1, scale: 6, anchor: [10.000000, 0.000000], anchor_note: "convention: $10 is provisional until the first priced run; 0 is zero cost", note: "NA when no cost basis; never 0" }
      - { id: cost_of_pass,            source: [D],    better: lower,  grader: cost,        kind: derived, weight: 0, note: "derived; cell composites read kind: score only (R-78 DR-S-3)" }
      - { id: tokens_per_solved,       source: [D],    better: lower,  grader: cost,        kind: derived, weight: 0, note: "derived; cell composites read kind: score only (R-78 DR-S-3)" }
      - { id: wall_clock_split,        source: [H],    better: lower,  grader: cost,        kind: derived, weight: 0, note: "wall, model, tool, idle; cell composites read kind: score only (R-78 DR-S-3)" }
      - { id: tokens_per_minute,       source: [D],    better: higher, grader: cost,        kind: score, weight: 0 }
      - { id: output_tokens_per_turn,  source: [D],    better: lower,  grader: cost,        kind: score, weight: 0 }
      - { id: turns_and_tool_calls,    source: [H],    better: lower,  grader: cost,        kind: derived, weight: 0 }
      - { id: cache_hit_ratio,         source: [H, D], better: higher, grader: cost,        kind: score, weight: 1, scale: 4, anchor: [0.0000, 100.0000], anchor_note: "spec docs/design/phase3-cost.md:106" }
      - { id: cache_write_amplification, source: [D],  better: lower,  grader: cost,        kind: score, weight: 1, scale: 4, anchor: [100.0000, 0.0000], anchor_note: "spec docs/design/phase3-cost.md:116" }
      - { id: context_growth,          source: [H, D], better: lower,  grader: cost,        kind: score, weight: 1, anchor: [134980, 0], anchor_note: "measured smoke-1 codex-sol per-call peak 14633..67490 (6 tasks, 1 run; Copilot session totals and Claude Code acp_turn are NA), worst = 2x the max, re-anchor at 0.6 if any cell saturates", note: "peak, slope, turns to 50% window" }
      - { id: compactions,             source: [H],    better: lower,  grader: cost,        kind: score, weight: 0 }
      - { id: coordinator_overhead,    source: [D],    better: lower,  grader: cost,        kind: derived, weight: 0, note: "reported, never charged to a cell" }
  correctness:
    title: Correctness
    metrics:
      - { id: pass_at_1,               source: [D], better: higher, grader: correctness, kind: score, weight: 0, note: "gate factor in 0.5 (R-78 DR-S-2 amendment)" }
      - { id: pass_at_k,               source: [D], better: higher, grader: correctness, kind: derived, weight: 0 }
      - { id: pass_hat_k,              source: [D], better: higher, grader: correctness, kind: derived, weight: 0, note: "all k reps pass; cell composites read kind: score only (R-78 DR-S-3)" }
      - { id: partial_credit,          source: [D], better: higher, grader: correctness, kind: score, weight: 1, scale: 4, anchor: [0.0000, 1.0000], anchor_note: "convention: ratio in [0, 1]" }
      - { id: build_and_suite_clean,   source: [D], better: higher, grader: correctness, kind: score, weight: 1, anchor: [0, 1], anchor_note: "convention: binary indicator in [0, 1]" }
      - { id: mutation_score,          source: [D], better: higher, grader: mutation,    kind: score, weight: 1, scale: 4, anchor: [0.0000, 1.0000], anchor_note: "convention: ratio in [0, 1]" }
      - { id: regression_count,        source: [D], better: lower,  grader: correctness, kind: score, weight: 1, anchor: [1, 0], anchor_note: "convention: one regression is a correctness failure (design phase3-graders.md:331)" }
      - { id: behavioural_equivalence, source: [D], better: higher, grader: correctness, kind: score, weight: 1, anchor: [0, 1], anchor_note: "convention: ratio in [0, 1]", note: "D-tasks only" }
      - { id: formal_checks_clean,     source: [D], better: higher, grader: formal,      kind: score, weight: 1, anchor: [0, 1], anchor_note: "convention: binary indicator in [0, 1]", note: "G-tasks: lake build, #print axioms standard only, no sorry/admit/axiom; TLC completes in bounds" }
      - { id: bugs_confirmed,          source: [D], better: higher, grader: formal,      kind: score, weight: 1, anchor: [0, 1], anchor_note: "convention: binary indicator in [0, 1]", note: "G-tasks: reported bugs reproduced by a failing test on the real code" }
  rigor:
    title: Rigor & quality
    metrics:
      - { id: verification_before_done, source: [D],    better: higher, grader: rigor, kind: score, weight: 1, anchor: [0, 1], anchor_note: "convention: binary indicator in [0, 1]" }
      - { id: test_quality,             source: [D, J], better: higher, grader: rigor, kind: score, weight: 1, anchor: [0, 1], anchor_note: "convention: ratio in [0, 1]" }
      - { id: static_analysis_delta,    source: [D],    better: lower,  grader: rigor, kind: score, weight: 1, anchor: [10, 0], anchor_note: "convention: cap at 10 added warnings; no spec ceiling; a negative delta clamps to 100", note: "incl. LOA001-LOA102 when pack on" }
      - { id: maintainability,          source: [D],    better: higher, grader: rigor, kind: score, weight: 1, anchor: [0, 100], anchor_note: "convention: index in [0, 100]" }
      - { id: style_conformance,        source: [D, J], better: higher, grader: rigor, kind: score, weight: 1, anchor: [0, 1], anchor_note: "convention: ratio in [0, 1]" }
      - { id: honest_completion_claims, source: [J],    better: higher, grader: judge, kind: score, weight: 1, anchor: [0, 2], anchor_note: "judged sum of n items at 0..2 (judge.py:22, adr_quality.md:5), n=1 provisional until the rubric lands; re-anchor to 2n at 0.6" }
      - { id: error_handling,           source: [J],    better: higher, grader: judge, kind: score, weight: 1, anchor: [0, 2], anchor_note: "judged sum of n items at 0..2 (judge.py:22, adr_quality.md:5), n=1 provisional until the rubric lands; re-anchor to 2n at 0.6" }
      - { id: bug_claim_precision,      source: [D],    better: higher, grader: formal, kind: score, weight: 1, scale: 4, anchor: [0, 1], anchor_note: "convention: ratio in [0, 1]", note: "G-tasks: confirmed / claimed" }
  drift:
    title: Drift & adherence
    metrics:
      - { id: spec_coverage,          source: [D, J], better: higher, grader: drift, kind: score, weight: 1, anchor: [0, 1], anchor_note: "convention: ratio in [0, 1]" }
      - { id: scope_creep,            source: [D],    better: lower,  grader: drift, kind: score, weight: 1, anchor: [1504, 0], anchor_note: "measured smoke-1 0..752, worst = 2x the smoke-1 max, re-anchor at 0.6 if any cell saturates" }
      - { id: scope_creep_files,      source: [D],    better: lower,  grader: drift, kind: score, weight: 0, note: "the files scope_creep counts (US-30)" }
      - { id: constraint_violations,  source: [D, J], better: lower,  grader: drift, kind: score, weight: 1, anchor: [5, 0], anchor_note: "convention: cap at 5 constraint violations; provisional until the first checklist exists; 0 is clean", note: "MTAC-IFBench categories" }
      - { id: goal_drift_slope,       source: [J],    better: lower,  grader: judge, kind: score, weight: 1, anchor: [2, 0], anchor_note: "judged sum of n items at 0..2 (judge.py:22, adr_quality.md:5), n=1 provisional until the rubric lands; re-anchor to 2n at 0.6" }
      - { id: convention_drift,       source: [D],    better: lower,  grader: drift, kind: score, weight: 1, scale: 2, anchor: [10.00, 0.00], anchor_note: "spec docs/design/phase3-graders.md:426" }
      - { id: instruction_reread_rate, source: [D],   better: higher, grader: drift, kind: score, weight: 0, note: "diagnostic" }
      - { id: unrequested_behaviour,  source: [J],    better: lower,  grader: judge, kind: score, weight: 1, anchor: [2, 0], anchor_note: "judged sum of n items at 0..2 (judge.py:22, adr_quality.md:5), n=1 provisional until the rubric lands; re-anchor to 2n at 0.6" }
      - { id: statement_integrity,    source: [D],    better: higher, grader: formal, kind: score, weight: 1, anchor: [0, 1], anchor_note: "convention: binary indicator in [0, 1]", note: "G-tasks: given statements/properties byte-identical (hash)" }
  specification:
    title: Specification & clarification
    metrics:
      - { id: ask_vs_assume,             source: [D],    better: higher, grader: clarify,      kind: score, weight: 1, scale: 4, anchor: [0.0000, 1.0000], anchor_note: "convention: ratio in [0, 1]" }
      - { id: key_question_recall,       source: [D, J], better: higher, grader: clarify,      kind: score, weight: 1, scale: 4, anchor: [0.0000, 1.0000], anchor_note: "convention: ratio in [0, 1]" }
      - { id: key_question_precision,    source: [D, J], better: higher, grader: clarify,      kind: score, weight: 1, scale: 4, anchor: [0.0000, 1.0000], anchor_note: "convention: ratio in [0, 1]" }
      - { id: asked_unmatched,           source: [D],    better: lower,  grader: clarify,      kind: score, weight: 0, note: "questions whose stored decision matched nothing (R-52 c2)" }
      - { id: assumption_disclosure,     source: [J],    better: higher, grader: judge,        kind: score, weight: 1, anchor: [0, 2], anchor_note: "judged sum of n items at 0..2 (judge.py:22, adr_quality.md:5), n=1 provisional until the rubric lands; re-anchor to 2n at 0.6" }
      - { id: spec_quality,              source: [J],    better: higher, grader: judge,        kind: score, weight: 1, anchor: [0, 16], anchor_note: "spec tasks/B1/oracle/rubric.md:18" }
      - { id: architecture_conformance,  source: [D],    better: higher, grader: architecture, kind: score, weight: 1, scale: 4, anchor: [0.0000, 1.0000], anchor_note: "convention: ratio in [0, 1]" }
      - { id: adr_quality,               source: [J],    better: higher, grader: judge,        kind: score, weight: 1, scale: 1,
          rubrics: { C1: adr_quality.md }, artifact: [docs/architecture.md, priority_queue.py],
          anchor: [0.0, 14.0], anchor_note: "spec bench/rubrics/adr_quality.md:15",
