# List prices per model, dated. cost.py multiplies token counts by the entry in force on the
# run date. Prices are copied from the provider's published price page, with the URL and the
# date read. An absent or null price makes cost NA for that cell (excluded from the composite,
# with the exclusion stated), never an estimate from memory.
schema: bench-prices/1
currency: USD
unit: per_million_tokens
entries: []
# Entry shape:
#  - model: claude-opus-5-5
#    effective: 2026-09-23          # date the price was read
#    source: <price page URL>
#    input: <number>
#    output: <number>
#    cache_read: <number>
#    cache_write: <number>
