\* Liveness at 1 cell, 1 crash, without symmetry (unsound for liveness). The properties are per cell,
\* and cells interact only through the parallelism guard, which cannot bind at these bounds.
\* Only the engine grades here (grading contention is safety, checked in the grading config); two
\* pass ids let the engine restart a pass that a crash abandoned.
CONSTANTS
    Cells = {c1}
    Parallelism = 2
    MaxCrashes = 1
    Passes = {p1, p2}
    Graders = {"engine"}
    BUG = "none"

SPECIFICATION Spec

INVARIANTS
    TypeOK

PROPERTIES
    DecisionEventuallyResolved
    StopReachesTerminal
    EndedCellsGetArchived
    PromptedCellsEnd
    ArchivedCellsGetGraded

CHECK_DEADLOCK FALSE
