# Claude Code cell profile (ADR-0003, ADR-0004, ADR-0013). Values in {braces} are filled per cell.
harness: claude-code
vendor: anthropic   # R-73 item 1: a profile fact, never inferred from a model id
home_env: CLAUDE_CONFIG_DIR
credential: { source: "~/.claude/.credentials.json", name: ".credentials.json" }
credential_kind: "subscription login (copied)"
command: ["{node}", "{adapter}"]
shutdown_grace_seconds: 10
# allow: every id of the ADR-0004 classes (shell; file read and edit) that the pinned build exposes on this
# platform, read from the build (R-34; tests/test_allowlist_classes.py). PowerShell is 2.1.282's Windows shell.
# NotebookEdit is the deferred (ToolSearch-gated) file-edit id for .ipynb, in-class per R-35.
# defaultMode matches the ACP session's effective default mode (R-34 c4).
files:
  # disableClaudeAiConnectors (R-56 c1, R-57 gate 2): true in any settings source keeps claude.ai MCP cloud
  # connectors out of the cell (the pinned 2.1.282 settings schema; env ENABLE_CLAUDEAI_MCP_SERVERS also exists,
  # the settings key is used per the Leader's ruling). Closure is measured by the re-qualification cell's
  # account_connector_tools count, not this line alone.
  # {delegate} (R-74 item 3): `, "Agent"` in a scenario-6 cell only, from the reader's class `delegate`; empty elsewhere,
  # so every other cell's settings.json is byte for byte what it was.
  settings.json: '{"permissions": {"allow": ["Bash", "PowerShell", "Edit", "Write", "NotebookEdit", "Read", "Glob", "Grep", "mcp__scripted_user__ask_user"{delegate}], "defaultMode": "default"}, "disableClaudeAiConnectors": true}'
env:
  ANTHROPIC_MODEL: "{model}"
  CLAUDE_CODE_EXECUTABLE: "{exe}"
  # ADR-0024 s3: a pinned effort; left out of a "default" cell's env (Verified honoured: spike C1, transcript `.effort`)
  CLAUDE_CODE_EFFORT_LEVEL: "{effort}"
# ADR-0024 s3: what a combo may pin. Effort values: the pinned SDK's EffortLevel (claude-agent-sdk sdk.d.ts:688). Context
# is part of the model id: `[1m]` is 1,000,000 (the plan refuses an id and a context that disagree). default_serves:
# 200,000 for context is Inferred (the probe confirms); a default effort depends on the model, so it is not declared.
settings:
  effort: {values: [low, medium, high, xhigh, max], apply: placeholder, default_serves: null}
  context: {values: ["1000000"], apply: model_id, default_serves: 200000}
# ADR-0026 s1: Claude's thinking display, sent as session/new `_meta` (the shape spike-settings/claude/acp3.jsonl sent)
session_meta: {claudeCode: {options: {thinking: {type: adaptive, display: summarized}}}}
mode: null
record_glob: "projects/**/{session_id}.jsonl"
# R-74 item 4: each sub-agent's transcript, its own file under the session's folder. assume: build 2.1.282 writes it there
# (the shape the pack's session-profile.py reads from a measured store, F-18: <session>/subagents/agent-*.jsonl);
# confirm: the R-74 c6 qualification turn lists the tree after one delegated turn; breaks: no such file, then sub-agent
# calls are not recorded and the Claude Code allowance is withheld until a record source exists.
subagent_glob: "projects/**/{session_id}/subagents/agent-*.jsonl"
usage_source: acp_turn   # its native record misses the final and auxiliary calls (docs/notes/decision-token-source-per-harness.md)
auxiliary_models: ["claude-haiku-4-5"]   # title generation; a served model starting with one of these is allowed (US-11)
# ADR-0024 s5 (Leader ruling PROBE-FIX-2 A): the `[1m]` pin is served as the API id, which the transcript's message.model
# records (devprobe-rerun-1). Exact pair only; the window is judged by context alone (HB-VAL-010).
model_aliases:
  "claude-opus-5-5[1m]": ["claude-opus-5-5"]
