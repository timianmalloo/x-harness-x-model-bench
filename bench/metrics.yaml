      - { id: completion_without_intervention, source: [D], better: higher, grader: process, kind: score, weight: 1, anchor: [0, 1], anchor_note: "convention: binary indicator in [0, 1]" }
      - { id: stuck_loops,                     source: [D], better: lower,  grader: process, kind: score, weight: 1, anchor: [4, 0], anchor_note: "measured smoke-1 0..2, worst = 2x the smoke-1 max, re-anchor at 0.6 if any cell saturates" }
      - { id: recovery_rate,                   source: [D], better: higher, grader: process, kind: score, weight: 1, scale: 4, anchor: [0.0000, 1.0000], anchor_note: "convention: ratio in [0, 1]" }
      - { id: tool_error_rate,                 source: [H], better: lower,  grader: process, kind: score, weight: 1, scale: 4, anchor: [1.0000, 0.0000], anchor_note: "convention: ratio in [0, 1]" }
