    expected: format
    question: "What file format should be used to store the wing definition?"
  - id: h10
    kind: normalised
    transform: case (lower)
    expected: format
    question: "what file format should be used to store the wing definition?"
  - id: h11
    kind: normalised
    transform: punctuation (question mark dropped)
    expected: format
    question: "What file format should be used to store the wing definition"
  - id: h12
    kind: paraphrase
    expected: format
    question: "Which serialization format should be used to save the wing: JSON, XML, YAML, or binary?"
  - id: h13
    kind: paraphrase
    expected: format
    question: "What data format do you want the wing project document to be in?"
  - id: h14
    kind: compound
    expected: format
    question: "What file format should be used to store the wing, and should it be human-readable?"

  # --- expected: versioning ----------------------------------------------------------------------------------------
  - id: h15
    kind: exact
    expected: versioning
    question: "Does the wing file format require an explicit schema version identifier?"
  - id: h16
    kind: normalised
    transform: case (lower)
    expected: versioning
    question: "does the wing file format require an explicit schema version identifier?"
  - id: h17
    kind: normalised
    transform: punctuation (question mark dropped)
    expected: versioning
    question: "Does the wing file format require an explicit schema version identifier"
  - id: h18
    kind: paraphrase
    expected: versioning
    question: "Should the saved file include a schema version or format header?"
  - id: h19
    kind: paraphrase
    expected: versioning
    question: "Do we need versioning in the serialized wing document to handle future schema changes?"

  # --- expected: validation ----------------------------------------------------------------------------------------
  - id: h20
    kind: exact
    expected: validation
    question: "How should invalid files or data that violates wing invariants be handled when loading?"
  - id: h21
    kind: normalised
    transform: case (lower)
    expected: validation
    question: "how should invalid files or data that violates wing invariants be handled when loading?"
  - id: h22
    kind: normalised
    transform: punctuation (question mark dropped)
    expected: validation
    question: "How should invalid files or data that violates wing invariants be handled when loading"
  - id: h23
    kind: paraphrase
    expected: validation
    question: "What should happen if a file with invalid stations or negative chord is loaded?"
  - id: h24
    kind: paraphrase
    expected: validation
    question: "Should corrupted files fail loudly or attempt partial recovery?"

  # --- expected: scope ---------------------------------------------------------------------------------------------
  - id: h25
    kind: exact
    expected: scope
    question: "Does reusability apply only to the wing geometry definition or also to derived quantities and simulation results?"
  - id: h26
    kind: normalised
    transform: case (lower)
    expected: scope
    question: "does reusability apply only to the wing geometry definition or also to derived quantities and simulation results?"
  - id: h27
    kind: normalised
    transform: punctuation (question mark dropped)
    expected: scope
    question: "Does reusability apply only to the wing geometry definition or also to derived quantities and simulation results"
  - id: h28
    kind: paraphrase
    expected: scope
    question: "Should we store computed planform values like span and area inside the file, or only stations?"
  - id: h29
    kind: paraphrase
    expected: scope
    question: "Are simulation outputs, CFD meshes, or polars stored alongside the wing?"

