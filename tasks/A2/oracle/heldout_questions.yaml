  - id: h10
    kind: paraphrase
    expected: premise-at-least-one-1
    question: "What should happen if the string S contains no 1s at all?"
  - id: h11
    kind: paraphrase
    expected: premise-at-least-one-1
    question: "Does the string always contain at least one 1?"
  - id: h12
    kind: paraphrase
    expected: premise-at-least-one-1
    question: "Can the input string contain only 0s?"
  - id: h13
    kind: paraphrase
    expected: premise-at-least-one-1
    question: "Is an all-zero string possible as input?"
  - id: h14
    kind: paraphrase
    expected: premise-at-least-one-1
    question: "Will S ever be all zeros, or is at least one 1 guaranteed?"
  - id: h15
    kind: paraphrase
    expected: premise-at-least-one-1
    question: "Could S consist of only 0s with no 1s present?"
  - id: h16
    kind: paraphrase
    expected: premise-at-least-one-1
    question: "Are we guaranteed that there is at least one occurrence of the character 1 in S?"
  - id: h17
    kind: compound
    expected: premise-at-least-one-1
    note: "the premise part matches; the second part (length N) is already given in constraints"
    question: "Is it guaranteed that S contains at least one 1, and what is the maximum length N?"
  # --- expected: default, near-miss ---------------------------------------------------------------------------------
  - id: n01
    kind: near-miss
    expected: default
    note: "shares vocabulary; asks whether all 1s can occur, not whether all 0s are possible"
    question: "Can the string S consist entirely of 1s?"
  - id: n02
    kind: near-miss
    expected: default
    note: "asks about 0s guarantee; not the deleted premise"
