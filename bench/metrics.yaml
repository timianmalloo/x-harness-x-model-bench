      - { id: per_agent_attribution, source: [H],    better: higher, grader: coordination, kind: score, weight: 1, anchor: [0, 1], anchor_note: "convention: ratio in [0, 1]" }
      - { id: handoff_fidelity,      source: [J],    better: higher, grader: judge,        kind: score, weight: 1, anchor: [0, 2], anchor_note: "judged sum of n items at 0..2 (judge.py:22, adr_quality.md:5), n=1 provisional until the rubric lands; re-anchor to 2n at 0.6" }
      - { id: intent_log_completeness, source: [D, P], better: higher, grader: coordination, kind: score, weight: 1, anchor: [0, 1], anchor_note: "convention: ratio in [0, 1]" }
      - { id: kg_use,                source: [D, P], better: higher, grader: coordination, kind: score, weight: 1, anchor: [0, 1], anchor_note: "convention: ratio in [0, 1]" }
      - { id: coordination_overhead, source: [D],    better: lower,  grader: coordination, kind: score, weight: 1, anchor: [1, 0], anchor_note: "convention: cap at 1.0 overhead ratio (100%); undefined in code today; 0 is no overhead" }
      - { id: mast_failure_codes,    source: [J],    better: lower,  grader: judge,        kind: score, weight: 1, anchor: [2, 0], anchor_note: "judged sum of n items at 0..2 (judge.py:22, adr_quality.md:5), n=1 provisional until the rubric lands; re-anchor to 2n at 0.6" }
      - { id: parallel_efficiency,   source: [D],    better: higher, grader: coordination, kind: score, weight: 1, anchor: [0, 1], anchor_note: "convention: ratio in [0, 1]" }
