# Claude Code cell profile (ADR-0003, ADR-0004, ADR-0013). Values in {braces} are filled per cell.
harness: claude-code
vendor: anthropic   # R-73 item 1: a profile fact, never inferred from a model id
home_env: CLAUDE_CONFIG_DIR
credential: { source: "~/.claude/.credentials.json", name: ".credentials.json" }
credential_kind: "subscription login (copied)"
command: ["{node}", "{adapter}"]
shutdown_grace_seconds: 10
# allow: every id of the ADR-0004 classes (shell; file read and edit) that the pinned build exposes on this
# platform, read from the build (R-34; tests/test_allowlist_classes.py). PowerShell is 2.1.282's Windows shell.
# NotebookEdit is the deferred (ToolSearch-gated) file-edit id for .ipynb, in-class per R-35.
# defaultMode matches the ACP session's effective default mode (R-34 c4).
files:
  # disableClaudeAiConnectors (R-56 c1, R-57 gate 2): true in any settings source keeps claude.ai MCP cloud
  # connectors out of the cell (the pinned 2.1.282 settings schema; env ENABLE_CLAUDEAI_MCP_SERVERS also exists,
  # the settings key is used per the Leader's ruling). Closure is measured by the re-qualification cell's
  # account_connector_tools count, not this line alone.
  settings.json: '{"permissions": {"allow": ["Bash", "PowerShell", "Edit", "Write", "NotebookEdit", "Read", "Glob", "Grep", "mcp__scripted_user__ask_user"], "defaultMode": "default"}, "disableClaudeAiConnectors": true}'
env:
  ANTHROPIC_MODEL: "{model}"
  CLAUDE_CODE_EXECUTABLE: "{exe}"
mode: null
record_glob: "projects/**/{session_id}.jsonl"
usage_source: acp_turn   # its native record misses the final and auxiliary calls (docs/notes/decision-token-source-per-harness.md)
auxiliary_models: ["claude-haiku-4-5"]   # title generation; a served model starting with one of these is allowed (US-11)
