# Copilot cell profile (ADR-0003, ADR-0013; docs/design/phase2-copilot-profile.md). ADR-0028 (Ruling 120): copilot -p
# behind the pinned local ACP adapter bench/adapters/copilot_p_acp.py, the only mode in which 1.0.89-1 applies
# --context long_context. The adapter adds -p <text> and --session-id / --resume per prompt. --available-tools stays
# last: profiles.argv extends that list with the scenario-6 ids and the scripted-user tool. The R-COPILOT-P spike
# (2026-10-12) ran this argv without --allow-all-tools: non-interactive, and the model was offered exactly these tools.
harness: copilot
vendor: openai   # R-73 item 1: a profile fact, never inferred from a model id
home_env: COPILOT_HOME
credential: null
credential_kind: "subscription login (credential store)"
files: {}
command: ["{python}", "{adapter}", "--exe", "{exe}", "--", "--output-format", "json", "--model", "{model}", "--reasoning-effort", "{effort}", "{context_arg}", "--allow-tool", "shell", "--allow-tool", "write", "--add-dir", "{home}", "--no-ask-user", "--disable-builtin-mcps", "--log-level", "debug", "--log-dir", "{home}/logs", "--available-tools", "powershell", "list_powershell", "read_powershell", "stop_powershell", "apply_patch", "view", "glob", "rg", "skill"]
shutdown_grace_seconds: 10
# instr/w16, owner decision 2026-10-14: HOME and USERPROFILE are the cell home, as for Grok and agy. Measured before
# (W9): 7 of 9 HB-VAL-012 cells were a command naming $env:USERPROFILE, which pointed at the operator's profile outside
# the cell, and Copilot's path verification denied it. Spike 2026-10-14 (copilot 1.0.89-1, gpt-6.1-sol served, login
# kept): with the home vars at the cell home, `$env:USERPROFILE` is still denied unless the cell home is an allowed
# directory (only the cwd and the system temp folder are by default), so `--add-dir {home}` is in both commands.
# APPDATA and LOCALAPPDATA stay the operator's: uv's Python store lives under them and moving them hides it.
user_home_vars: [HOME, USERPROFILE]
env:
  COPILOT_AUTO_UPDATE: "false"
mode: null
set_model: false   # the model is in argv; the adapter accepts session/set_model but nothing reads it
record_glob: "session-state/{session_id}/events.jsonl"
usage_source: native_record
auxiliary_models: []
scripted_user: unsupported   # ADR-0028 s7: until a spike shows the MCP wiring works in -p mode
settings:
  effort:
    values: [none, minimal, low, medium, high, xhigh, max]   # copilot --help, 1.0.89-1
    apply: placeholder
    default_serves: null
  context:
    values: ["default", "922000"]
    apply: placeholder
    default_serves: 272000   # ADR-0024 s3; judged by session.start.contextTier (ADR-0028 s5)
    args:
      "default": []
      "922000": ["--context", "long_context"]
# Plan row A3, the transport control (docs/runbooks/lean-comparison-run.md s4): a combo with `transport: acp` launches
# native `copilot --acp` (no adapter) with the same model, effort, tools and debug logs; everything else above is shared.
# Over ACP 1.0.89-1 serves 272000 whatever the tier flag or settings.json say (probe 2026-10-14), so the plan refuses any
# context but default, and the control pair is ACP against `-p` both at context default. set_model stays false: the
# model is in argv, and HB-VAL-002 judges the served model from the record.
transports:
  acp:
    command: ["{exe}", "--acp", "--model", "{model}", "--reasoning-effort", "{effort}", "--allow-tool", "shell", "--allow-tool", "write", "--add-dir", "{home}", "--disable-builtin-mcps", "--log-level", "debug", "--log-dir", "{home}/logs", "--available-tools", "powershell", "list_powershell", "read_powershell", "stop_powershell", "apply_patch", "view", "glob", "rg", "skill"]
    contexts: ["default"]
