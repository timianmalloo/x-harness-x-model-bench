      - { id: model_conformance,         source: [D],    better: higher, grader: formal,       kind: score, weight: 1, scale: 4, anchor: [0, 1], anchor_note: "convention: ratio in [0, 1]", note: "G-tasks: real-code traces accepted by the agent's model / traces" }
      - { id: model_non_vacuity,         source: [D],    better: higher, grader: formal,       kind: score, weight: 1, scale: 4, anchor: [0, 1], anchor_note: "convention: ratio in [0, 1]", note: "G-tasks: bug-seeded variants rejected / variants" }
