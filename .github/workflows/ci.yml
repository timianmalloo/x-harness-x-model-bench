name: ci

on:
  push:
    branches: [main]
  pull_request:
  schedule:
    - cron: "17 9 * * *"   # nightly: the lifecycle model at the US-44 bounds

permissions:
  contents: read

jobs:
  test:
    # Windows: cells run in Job Objects (ADR-0013). The credentials tests need the operator's harness
    # logins and real model calls, so they run on the workstation only.
    if: github.event_name != 'schedule'
    runs-on: windows-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      - uses: astral-sh/setup-uv@v6
      - run: uv sync --locked
      - run: uv run bench validate
      - run: uv run pytest -q -m "not credentials"
      - run: uv run python docs/ai-forward-pack/scripts/docs-graph.py validate

  models:
    # TLA+ lifecycle model (spec US-44). Every push: all invariants at small bounds, grading at
    # 2 passes, liveness, the witness, and every seeded variant rejected by its own target.
    # Nightly: safety at the US-44 bounds (3 cells, parallelism 2, 1 crash) as well.
    runs-on: ubuntu-latest
    timeout-minutes: 240
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "21"
      - if: github.event_name != 'schedule'
        run: python3 tools/check_models.py --quick
      - if: github.event_name == 'schedule'
        run: python3 tools/check_models.py
