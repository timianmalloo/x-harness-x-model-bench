\* Two-turn cells (ADR-0015 section 7): 2 cells, parallelism 1, 1 crash, engine-only grading, with symmetry.
\* The turn invariants need a second turn, so NumTurns = 2 here; run_lifecycle.safety.cfg keeps NumTurns = 1.
\* tools/check_models.py derives the turn-rule seeded variants and the two turn witnesses from this file.
CONSTANTS
    Cells = {c1, c2}
    Parallelism = 1
    MaxCrashes = 1
    Passes = {p1}
    Graders = {"engine"}
    NumTurns = 2
    BUG = "none"

SPECIFICATION Spec

SYMMETRY Symmetry

INVARIANTS
    TypeOK
    PromptOncePerTurn
    SnapshotBeforeNextTurn
    NoSnapshotInFlight
    CrashedTurnPredicate
    ArchiveExistsMeansComplete
    NoPromptAfterOutcome
    NoArchiveWhileLive
    NothingDeletedUnarchived
    GradedOncePerPass
    GradedOnlyWhenArchived
    NoLaunchBesideOrphan
    NoOutcomeWhileRunning
    StoppedNeverRelaunched
    ControlAppliedOnce
    ParallelismBound

CHECK_DEADLOCK FALSE
