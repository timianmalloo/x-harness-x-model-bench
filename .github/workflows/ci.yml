name: ci

on:
  workflow_dispatch:
    inputs:
      full_models:
        description: Run the full lifecycle model check
        type: boolean
        default: false

permissions:
  contents: read

jobs:
  test:
    # Windows: cells run in Job Objects (ADR-0013). The credentials tests need the operator's harness
    # logins and real model calls, so they run on the workstation only.
    if: ${{ !inputs.full_models }}
    runs-on: windows-latest
    # 30 again (was 60 while the ring ran 24-32 min): three consecutive green test jobs under 22 min after CI-OPT
    # (13.4, 16.7 and 8.8 min; runs 36354105591, 36356656002, 36360514246 - the last with pytest -n auto).
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: astral-sh/setup-uv@v6
      - run: uv sync --locked
      - run: uv run bench validate
      # -n auto: CI-OPT slice 7 measured 1802 passed, 0 failed, twice each under -n 4 and -n 24 (docs/notes/ci-opt-proposal.md)
      - run: uv run pytest -q -n auto -m "not credentials and not slow and not workstation and not gate and not browser"
      - run: uv run python docs/ai-forward-pack/scripts/docs-graph.py validate

  test-macos:
    # macOS: cells run in a POSIX process group with a watchdog standing in for kill-on-close (ADR-0013
    # Amendment 1, section 5; src/harness_bench/procs.py's POSIX branch). This is the only host that
    # proves that branch: it cannot be exercised on windows-latest (os.killpg/setsid do not exist
    # there). `native`-marked tests (Windows Job Objects) skip here automatically (conftest.py); the
    # POSIX mirror is `posix`-marked (tests/test_procs_posix.py) and runs for real here, nowhere else.
    if: ${{ !inputs.full_models }}
    runs-on: macos-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: astral-sh/setup-uv@v6
      - run: uv sync --locked
      - run: uv run pytest -q -n auto -m "not credentials and not slow and not workstation and not gate and not browser"

  models:
    # TLA+ lifecycle model (spec US-44). Every push: all invariants at small bounds, grading at
    # 2 passes, liveness, the witness, and every seeded variant rejected by its own target.
    # Nightly: safety at the US-44 bounds (3 cells, parallelism 2, 1 crash) as well.
    runs-on: ubuntu-latest
    timeout-minutes: 240
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "21"
      - if: ${{ !inputs.full_models }}
        run: python3 tools/check_models.py --quick
      - if: inputs.full_models
        run: python3 tools/check_models.py
