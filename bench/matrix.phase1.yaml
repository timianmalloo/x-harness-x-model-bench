# The phase-1 walking skeleton (docs/design/phase1-walking-skeleton.md): the X1 fixture on two combos,
# pack on and off, one repetition: four cells.
schema: bench-matrix/1
run_id: phase1
bom: { file: bench/bom.yaml, subset: [X1] }
repetitions: 1
packs: ["on", "off"]
combos:
  - { id: cc-sonnet, harness: claude-code, model: claude-sonnet-5 }
  - { id: codex-sol, harness: codex,       model: gpt-6-sol }
