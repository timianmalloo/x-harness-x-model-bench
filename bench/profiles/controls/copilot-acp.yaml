# CONTROL profile, not loaded by the bench (profiles.load reads bench/profiles/<harness>.yaml; config's glob is not
# recursive, so this folder is invisible to it). Copilot over native ACP (`copilot --acp`) for a transport control against
# `copilot -p` (plan row A3, docs/runbooks/lean-comparison-run.md). To use it on a control branch, copy it over
# bench/profiles/copilot.yaml and delete the `adapter_pin` line of the copilot entry in bench/tools/builds.yaml (no
# adapter_version in the plan makes views._prompt_mode False, the ACP-era reading). The ACP path was the bench's own
# before ADR-0028; the argv is that profile's with --reasoning-effort added.
#
# What is Verified (probe 2026-10-14, pinned 1.0.89-1, isolated COPILOT_HOME, one trivial prompt each): under --acp,
# `--context long_context` and settings.json `contextTier: long_context` both serve usage_update size 272000, and
# session.start.contextTier is null. So this control runs at the default window only (272000), and it is a control
# against `copilot -p` at context `default`, never against the 922000 pin. NOT verified: a whole cell or run through
# this profile, the Copilot reader on an ACP record, and --log-level debug / --log-dir under --acp.
harness: copilot
vendor: openai
home_env: COPILOT_HOME
credential: null
credential_kind: "subscription login (credential store)"
files: {}
command: ["{exe}", "--acp", "--model", "{model}", "--reasoning-effort", "{effort}", "--allow-tool", "shell", "--allow-tool", "write", "--disable-builtin-mcps", "--log-level", "debug", "--log-dir", "{home}/logs", "--available-tools", "powershell", "list_powershell", "read_powershell", "stop_powershell", "apply_patch", "view", "glob", "rg", "skill"]
shutdown_grace_seconds: 10
env:
  COPILOT_AUTO_UPDATE: "false"
mode: null
set_model: true
record_glob: "session-state/{session_id}/events.jsonl"
usage_source: native_record
auxiliary_models: []
settings:
  effort:
    values: [none, minimal, low, medium, high, xhigh, max]
    apply: placeholder
    default_serves: null
  context:
    values: ["default"]
    apply: placeholder
    default_serves: 272000
