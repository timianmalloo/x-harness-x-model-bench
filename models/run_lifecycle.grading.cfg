\* Grading at 2 passes (engine and `bench grade` contending for grade.lock): 2 cells, 1 crash, symmetry.
CONSTANTS
    Cells = {c1, c2}
    COORD = coord
    Parallelism = 2
    MaxCrashes = 1
    Passes = {p1, p2}
    Graders = {"engine", "bench"}
    BUG = "none"

SPECIFICATION Spec

SYMMETRY Symmetry

INVARIANTS
    TypeOK
    GradedOncePerPass
    GradedOnlyWhenArchived
    AtMostOneActivePass

CHECK_DEADLOCK FALSE
