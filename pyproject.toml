[project]
name = "harness-bench"
version = "0.1.0"
description = "Cross-harness, cross-model benchmarking for coding agents, with the AI-Forward pack as an experimental factor."
readme = "README.md"
license = "Apache-2.0"
requires-python = ">=3.12"
dependencies = [
    "pyyaml>=6.0",
    "rich>=13.0",
]

[project.scripts]
bench = "harness_bench.cli:main"

[dependency-groups]
dev = [
    "hypothesis>=6.100",
    "pytest>=8.0",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/harness_bench"]

[tool.pytest.ini_options]
testpaths = ["tests"]
# Real model cells (the `credentials` marker) run only on an explicit opt-in: `-m ""` or `-m credentials` (SUITE-A).
# The `slow` ring (real dotnet graders) runs on the grading host: `HB_REQUIRE_DOTNET=1 python -m pytest -m slow` (V-4).
# A command-line -m replaces this one, so .github/workflows/ci.yml excludes `slow` in its own -m as well.
addopts = "-m 'not credentials and not slow'"
markers = ["slow: the dotnet graders' fixtures; the Leader's pre-freeze ring on the grading host (HB_REQUIRE_DOTNET=1)"]
