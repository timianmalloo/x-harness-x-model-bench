\* Safety at the US-44 bounds (3 cells, parallelism 2, 1 crash, 1 grading pass), with symmetry.
\* tools/check_models.py --deep also runs it at 2 crashes (on demand; not completed so far).
\* Only the engine grades at these bounds (with `bench grade` too the space did not finish in 10 min).
\* check_models.py's small bounds add `bench grade` and check every invariant with it; mutual
\* exclusion between grading passes is checked in run_lifecycle.grading.cfg (2 passes).
\* tools/check_models.py derives every seeded-bug variant from this file by replacing BUG.
CONSTANTS
    Cells = {c1, c2, c3}
    Parallelism = 2
    MaxCrashes = 1
    Passes = {p1}
    Graders = {"engine"}
    BUG = "none"

SPECIFICATION Spec

SYMMETRY Symmetry

INVARIANTS
    TypeOK
    AtMostOnePrompt
    NoPromptAfterOutcome
    NoArchiveWhileLive
    NothingDeletedUnarchived
    GradedOncePerPass
    GradedOnlyWhenArchived
    AtMostOneActivePass
    ControlAppliedOnce
    NoLaunchAfterStop
    ParallelismBound
    StoppedNeverRelaunched
    DecisionResolvedOnce
    NoLaunchWhileDecisionOpen
    NoLaunchBesideOrphan
    NoOutcomeWhileRunning

CHECK_DEADLOCK FALSE
