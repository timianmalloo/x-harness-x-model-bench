# A4 held-out question set for the scripted-user matcher.
# Labelling rule: `expected` is the id of the clarification in clarifications.yaml whose `reply` answers what the
# question asks. Anything else is `default`, and its correct reply is exactly `default_reply`.
#
# kind:
#   exact       the annotated question, verbatim
#   normalised  the annotated question after one surface transform (`transform`)
#   paraphrase  a different wording of the same ambiguity
#   compound    asks the annotated ambiguity plus something else in one question
#   near-miss   labelled default, but shares the key question's or domain vocabulary
#   off-topic   labelled default; not about the requirement's content
schema: bench-heldout-questions/1
task: A4
clarifications: clarifications.yaml
default_reply: "Decide and state your assumption."
questions:
  # --- expected: persistence-vs-sharing ----------------------------------------------------------------------------
  - id: h01
    kind: exact
    expected: persistence-vs-sharing
    question: "Does making the wing definition reusable across runs mean saving it to a local file, or sharing it over a network service?"
  - id: h02
    kind: normalised
    transform: quotes (curly to straight)
    expected: persistence-vs-sharing
    question: 'Does making the wing definition reusable across runs mean saving it to a local file, or sharing it over a network service?'
  - id: h03
    kind: normalised
    transform: case (lower)
    expected: persistence-vs-sharing
    question: "does making the wing definition reusable across runs mean saving it to a local file, or sharing it over a network service?"
  - id: h04
    kind: normalised
    transform: whitespace (leading, trailing, doubled)
    expected: persistence-vs-sharing
    question: "  Does making the wing definition reusable across runs mean saving it to a local file,  or sharing it over a network service?  "
  - id: h05
    kind: normalised
    transform: punctuation (question mark dropped)
    expected: persistence-vs-sharing
    question: "Does making the wing definition reusable across runs mean saving it to a local file, or sharing it over a network service"
  - id: h06
    kind: paraphrase
    expected: persistence-vs-sharing
    question: "Should the wing be saved to a local disk file or synced to a central database or server?"
  - id: h07
    kind: paraphrase
    expected: persistence-vs-sharing
    question: "Are we persisting wing data locally on the machine or publishing it across a network?"
  - id: h08
    kind: compound
    expected: persistence-vs-sharing
    question: "Should the wing definition be stored locally on disk, and where should that file be located?"

  # --- expected: format --------------------------------------------------------------------------------------------
  - id: h09
