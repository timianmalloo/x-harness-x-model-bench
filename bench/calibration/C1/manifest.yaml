  11). Every item is synthetic, written for this set by the W3-CAL track: none is a cell''s output and none is a verdict (R-58
  c5).'
intended_score: 'Provenance only (R-72 condition 3): the score the author wrote the item to carry on its rubric item. It is
  not a label. No kappa, agreement or header row is computed from it; its one reader is the range check in tests/test_calibration_c1.py,
  and a test there asserts no code under src/ reads it.'
labels: None in 0.4 (R-72). labels.yaml is written only by a human labeller. This file shows intended_score, so a blind labeller
  reads items/ and code/ with the rubric, not this file.
layout: 'One item is one (artifact, rubric item) pair (design section 11). The artifact is two files: `path` is the item''s
  docs/architecture.md and `code` is its priority_queue.py; code files are shared across items. assume: the slice-5 calibration
  pass renders `path` as docs/architecture.md and `code` as priority_queue.py, the C1 artifact list of design section 7.1;
  the design names only items/<id>.md. Breaks: a pass that sends the note alone judges it with no code, so every ''consistent
  with the code'' reading loses its evidence. Confirm at W3-GW-I slice 5.'
