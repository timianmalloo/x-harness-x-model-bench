oracle:
  summary: "Six hidden unittest cases for tomli.loads_env on envkit.MappingSource, with src and vendor/envkit put on the path by the test (python -S, nothing installed). No oracle/check/: the no-guessing strategy (X-LG) restores the pristine vendor/envkit, runs these tests, and counts unresolved references to the vendored API in the radius (W1-L 7.0, 7.1; R-97)."
  runner: unittest
  command: ["{python}", "-S", "-m", "unittest", "-v", "test_interp_hidden"]
expected:
  reference:
    property_check_pass: 1                       # derived: the six hidden tests pass on the reference (observed through correctness.grade at authoring) and the primary is the hidden tests only. Not a grader output.
    hallucinated_symbol_errors: 0                # hand-traced: the reference names no envkit member at all (it calls source.fetch on a parameter). Inferred until X-LG's first strategy run.
    verified_before_use: { na: "not built" }     # W0 rev 5, W1-L 7.2: the producer is not built; every cell records NA
  naive:
    property_check_pass: 0                       # observed: the naive's import of envkit.EnvSource fails, so all six hidden tests fail
    hallucinated_symbol_errors: 1                # hand-traced: envkit.EnvSource; source.get(...) has an untyped receiver (the annotation names an unresolved class) and is not counted (R-97, "NG2 as declared"). Inferred until X-LG's first strategy run.
    verified_before_use: { na: "not built" }     # W0 rev 5, W1-L 7.2: the producer is not built, the same NA as the reference role
