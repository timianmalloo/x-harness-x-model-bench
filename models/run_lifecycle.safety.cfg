\* Safety at the US-44 bounds (3 cells, parallelism 2, 1 crash, 1 grading pass), with symmetry.
\* ADR-0025 s7: here every cell is one harness capped at Parallelism, so the cap never binds and the full cell symmetry
\* holds (a binding cap on two of three cells split it: over 30 min and 47 GB, not finished, 2026-10-12). The binding
\* cap is checked by check_models.py's small bounds (Capped = both cells, HarnessCap = 1) at parallelism 2 ("safety-cap").
\* tools/check_models.py --deep also runs it at 2 crashes (on demand; not completed so far).
\* Only the engine grades at these bounds (with `bench grade` too the space did not finish in 10 min).
\* check_models.py's small bounds add `bench grade` and check every invariant with it; mutual
\* exclusion between grading passes is checked in run_lifecycle.grading.cfg (2 passes).
\* tools/check_models.py derives every seeded-bug variant from this file by replacing BUG.
CONSTANTS
    Cells = {c1, c2, c3}
    Parallelism = 2
    Capped = {c1, c2, c3}
    HarnessCap = 2
    MaxCrashes = 1
    Passes = {p1}
    Graders = {"engine"}
    NumTurns = 1
    BUG = "none"

SPECIFICATION Spec

SYMMETRY Symmetry

INVARIANTS
    TypeOK
    PromptOncePerTurn
    SnapshotBeforeNextTurn
    NoSnapshotInFlight
    CrashedTurnPredicate
    ArchiveExistsMeansComplete
    NoPromptAfterOutcome
    NoArchiveWhileLive
    NothingDeletedUnarchived
    GradedOncePerPass
    GradedOnlyWhenArchived
    AtMostOneActivePass
    ControlAppliedOnce
    NoLaunchAfterStop
    ParallelismBound
    HarnessCapBound
    StopResumeRecordsStopped
    BetweenRecordedWithSnapshot
    SnapshotOnlyWhenNext
    StoppedNeverRelaunched
    DecisionResolvedOnce
    NoLaunchWhileDecisionOpen
    NoLaunchBesideOrphan
    NoOutcomeWhileRunning

CHECK_DEADLOCK FALSE
