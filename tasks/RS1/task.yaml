formal: null
property:
  name: resilience
  latent_requirement: "A call to a remote service must bound every attempt, retry only transient failures within the stated budget, and send a stable idempotency key so a replayed request takes effect once."
  evidence_paths: ["docs/ledger-service.md", "prometheus_client/exposition.py"]
  latent_terms: [timeout, retry, retries, backoff, idempot, dedup, deduplic, transient, circuit, jitter, "give up", "exactly once"]
  primary_metric: property_check_pass
  ceilings: {}
  fault_contract: {timeout_ms: 3000, tolerance_ms: 500, max_retries: 2}   # numbers are in the prompt; the mechanisms are latent (RQ-2)
graders: [correctness, property]
oracle:
  summary: "Six hidden unittest cases for post_event on a local http.server (stdlib only); then seven fault cases against a check-owned ledger fake on 127.0.0.1, one probe host per case (check.py). The fake answers per a fixed schedule; the check measures each call's wall time and reads the fake's request, effect and Idempotency-Key counters. The fault cases are judged on these schedules only."
  runner: unittest
  command: ["{python}", "-m", "unittest", "-v", "test_ledger_hidden"]
expected:
  reference:
    property_check_pass: 1                       # derived by W0 section 3: hidden tests pass (6/6) and every fault case passed. Not a grader output.
    fault_suite_pass: "1.0000"                   # 7 of 7; measured by the stand-in check in K2 (tests/test_rs1_task.py), not yet by the real grader
    idempotency_violations: 0                    # measured by the stand-in check in K2
  naive:
    property_check_pass: 0                       # the naive passes the 6 hidden tests and 3 of 7 cases, so the conjunction is 0
    fault_suite_pass: "0.4286"                   # 3 of 7 (f-5xx-persistent, f-lost-response, f-4xx); the K2 stand-in run's measured value is in oracle/evidence.md
    idempotency_violations: 0                    # the naive never retries, so no call has two effects
