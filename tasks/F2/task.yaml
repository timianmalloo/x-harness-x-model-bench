# One entry per track in prompt.md. Convention fixed by R-73 (the operator, 2026-09-25, F1's
# DR-F1-1): <role>@<vendor>; a cell reads only its own vendor's column. The strongest model takes
# the role that decides the public contract (as F1's domain-model); the workhorse takes the role
# that implements against it and the role that adversarially tests it (as F1's derived-quantities
# and tests). OpenAI columns follow F1's own choice of gpt-6-sol for the contract-deciding role and
# gpt-6-luna for the other two (F1's oracle/README.md DR-F1-1).
model_map:
  design@anthropic: claude-opus-5-5
  implement@anthropic: claude-sonnet-5
  adversarial-review@anthropic: claude-sonnet-5
  design@openai: gpt-6-sol
