oracle:
  summary: "Six hidden unittest cases for cachetools.limiter on a fake clock, with src and vendor/quotakit put on the path by the test (python -S, nothing installed). No oracle/check/: the no-guessing strategy (X-LG) restores the pristine vendor/quotakit, runs these tests, and counts unresolved references to the vendored API in the radius (W1-L 7.0, 7.1; R-97)."
  runner: unittest
  command: ["{python}", "-S", "-m", "unittest", "-v", "test_limiter_hidden"]
expected:
  reference:
    property_check_pass: 1                       # derived: the six hidden tests pass on the reference (observed through correctness.grade at authoring) and the primary is the hidden tests only. Not a grader output.
    hallucinated_symbol_errors: 0                # hand-traced: the reference names only quotakit.Gate, Gate.admit and the real clock keyword. Inferred until X-LG's first strategy run (R-97 condition 4).
    verified_before_use: { na: "not built" }     # W0 rev 5, W1-L 7.2: the producer is not built; every cell records NA
  naive:
    property_check_pass: 0                       # observed: the naive's import of quotakit.RateLimiter fails, so all six hidden tests fail
    hallucinated_symbol_errors: 2                # hand-traced: quotakit.RateLimiter and quotakit.RateLimitExceeded from the from-import; limiter.acquire() has an untyped receiver and is not counted (W1-L 7.3). Inferred until X-LG's first strategy run (R-97 condition 4).
    verified_before_use: { na: "not built" }     # W0 rev 5, W1-L 7.2: the producer is not built, the same NA as the reference role
